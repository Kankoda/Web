# Site settings
# These are used to personalize your site. You access them via {{ site.title }}, 
# {{ site.email }} and so on. You can create any custom variable you like. They
# will be accessible in the templates via {{ site.myvariable }}.

title: Kankoda
description: >-
  Kankoda builds apps and products for iOS, iPadOS, tvOS, macOS and watchOS, using technologies like Swift, SwiftUI and Swift Package Manager. 

url: http://kankoda.com
email: info@kankoda.com

copyright_year: 2021-2025
copyright_owner: Kankoda Sweden AB
copyright_url: https://kankoda.com

bluesky_username: "@kankoda.bsky.social"
github_username: Kankoda
mastodon_username: kankoda@mastodon.social
twitter_username: kankodahq

assets: /assets/
header_image: /assets/logo/logo.png

urls:
  blog:       /blog
  email:      mailto:info@kankoda.com
  rss:        https://kankoda.com/feed.xml

  appstore:   https://apps.apple.com/us/developer/kankoda-sweden-ab/id516398918
  bluesky:    https://bsky.app/profile/kankoda.bsky.social
  github:     https://github.com/kankoda
  gumroad:    https://kankoda.gumroad.com
  mastodon:   https://mastodon.social/@kankoda
  newsletter: https://kankoda.gumroad.com/subscribe
  twitter:    https://twitter.com/kankodahq

  keyboardkit: https://keyboardkit.com
  keyboardkitpro: https://keyboardkit.com/pro
  licensekit: https://kankoda.com/sdks/licensekit
  wally:      https://wally.app

  docc:       https://www.swift.org/documentation/docc/#:~:text=DocC%20syntax%20—%20called%20documentation%20markup,%2C%20code%20listings%2C%20and%20asides.
  jetpack:    https://developer.android.com/jetpack/compose
  kotlin:     https://kotlinlang.org
  spm:        https://www.swift.org/package-manager/
  swift:      https://developer.apple.com/swift/
  swiftui:    https://developer.apple.com/xcode/swiftui/

  stockholm:  https://www.google.com/maps/place/Stockholm,+Sweden/@59.3262131,17.8172499,11z/data=!3m1!4b1!4m6!3m5!1s0x465f763119640bcb:0xa80d27d3679d7766!8m2!3d59.3293235!4d18.0685808!16zL20vMDZteHM

header_pages:
  - index.html
  - pages/sdks.md
  - pages/apps.md
  - pages/blog.md

footer_sitemap:
  - index.html
  - pages/about.md
  - pages/sdks.md
  - pages/apps.md

footer_extra_title: SDKs
footer_extra:
  - pages/products/keyboardkit.md
  - pages/products/licensekit.md

collections_dir: collections

collections:
  apps:
    output: true
    permalink: /apps/:name/
  emojikit-features:
    output: true
    permalink: /emojikit/features/:name/
  licensekit-features:
    output: true
    permalink: /sdks/licensekit/features/:name/
  posts:
    output: true
    permalink: /blog/:categories/:year/:month/:day/:title

baseurl: ""
theme: minima
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  
include: [".well-known"]

plugins:
  - jekyll-feed
  - jekyll-redirect-from

defaults:
  -
    scope:
      type: apps
    values:
      layout: app
      hero-class: devices
  -
    scope:
      type: pages
    values:
      hero: ""
      layout: page
      image: /assets/headers/kankoda.jpg
  -
    scope:
      type: posts
    values:
      author: danielsaidi
      layout: post
      image: /assets/headers/kankoda.jpg
  -
    scope:
      type: licensekit-features
    values:
      hero-paper: 1
      layout: licensekit-feature
      image: /assets/headers/licensekit.png

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/