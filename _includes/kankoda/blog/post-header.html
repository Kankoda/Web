{%- assign post = include.post -%}
{%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}

<div class="post-header">
  <p>{% include kankoda/blog/post-tags.html tags=post.tags %}</p>
  <span class="date">
    {{ post.date | date: date_format }}
  </span>
  {% if include.follow == 1 %}
    · Follow on <a href="{{site.urls.twitter}}">Twitter</a> and <a href="{{site.urls.mastodon}}">Mastodon</a>
  {% endif %}
</div>
